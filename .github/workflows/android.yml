name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate debug keystore
      run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Master Reset App Icons (Fix Crash)
      run: |
        echo "Cleaning all corrupted icons..."
        rm -rf app/src/main/res/mipmap*/* || true
        
        echo "Generating safe 100% working fallback icons..."
        sudo apt-get update && sudo apt-get install -y imagemagick
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        
        # Ek simple blue logo banayega taaki app crash na ho
        convert -size 192x192 canvas:#0D47A1 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        convert -size 192x192 canvas:#0D47A1 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        
        # Safe Android Adaptive XML banayega
        cat <<EOF > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/white"/>
            <foreground android:drawable="@mipmap/ic_launcher"/>
        </adaptive-icon>
        EOF
        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

    - name: Fix permissions
      run: find . -name "gradlew" -exec chmod +x {} + || true

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -d "android" ] && [ -f "android/gradlew" ]; then
          cd android && ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Balaji-AC-App
        path: '**/*.apk'
