name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate debug keystore
      run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Safely Change App Logo
      run: |
        if [ -f "app/logo.png" ]; then
          echo "Generating safe Android icons..."
          # Install photo resizer tool
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # 1. Delete complex XML adaptive icons that cause crashes
          rm -rf app/src/main/res/mipmap-anydpi-v26
          rm -rf app/src/main/res/mipmap-anydpi-v33
          
          # 2. Clean old icon files
          find app/src/main/res/mipmap-* -name "ic_launcher*.png" -delete 2>/dev/null || true
          find app/src/main/res/mipmap-* -name "ic_launcher*.xml" -delete 2>/dev/null || true
          
          # 3. Create missing folders if they don't exist
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          
          # 4. Resize logo for all screen types perfectly
          convert app/logo.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert app/logo.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          
          convert app/logo.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert app/logo.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          
          convert app/logo.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert app/logo.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          
          convert app/logo.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert app/logo.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          
          convert app/logo.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert app/logo.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          echo "Logo safely updated without crash!"
        else
          echo "logo.png not found, using default."
        fi

    - name: Fix permissions
      run: find . -name "gradlew" -exec chmod +x {} + || true

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -d "android" ] && [ -f "android/gradlew" ]; then
          cd android && ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Balaji-AC-App
        path: '**/*.apk'
