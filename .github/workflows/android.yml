name: Final Public Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        # Project root aur app folder dono jagah copy karein taaki gradle ko mil jaye
        cp ~/.android/debug.keystore ./debug.keystore
        mkdir -p app
        cp ~/.android/debug.keystore ./app/debug.keystore

    - name: Fix permissions
      run: find . -name "gradlew" -exec chmod +x {} + || true

    - name: Build Final APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -d "android" ] && [ -f "android/gradlew" ]; then
          cd android && ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload Public APK
      uses: actions/upload-artifact@v4
      with:
        name: Balaji-AC-App-Public
        path: '**/*.apk'
