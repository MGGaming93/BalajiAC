name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate debug keystore
      run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup Real Firebase Connection
      run: |
        find . -name "gradlew" -exec chmod +x {} + || true
        # Purani dummy file hatayein
        rm -f app/src/main/res/values/firebase_dummy.xml
        
        # Sahi package name ke sath google-services.json banayein
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "486108461001",
            "project_id": "gen-lang-client-0026565754",
            "storage_bucket": "gen-lang-client-0026565754.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:486108461001:android:ed57d62a281d65f3b61a18",
                "android_client_info": {
                  "package_name": "com.MGGaming.BalajiAc"
                }
              },
              "oauth_client": [
                {
                  "client_id": "486108461001-gcd898988iujj9g7510hkd90lvmootdr.apps.googleusercontent.com",
                  "client_type": 1,
                  "android_info": {
                    "package_name": "com.MGGaming.BalajiAc",
                    "certificate_hash": "a94c6ba79397035a14e7e6802d1ced0a25490e09"
                  }
                },
                {
                  "client_id": "486108461001-ps621v0k680ofe2oqaf2v6fh9q1ej56r.apps.googleusercontent.com",
                  "client_type": 3
                }
              ],
              "api_key": [
                {
                  "current_key": "AIzaSyAWOLmfJG_-1rM73UcIuIwgDj3BoO6edDk"
                }
              ]
            }
          ],
          "configuration_version": "1"
        }
        EOF
        
        # Sahi web client ID banayein
        mkdir -p app/src/main/res/values
        cat << 'EOF' > app/src/main/res/values/firebase_web_client.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="default_web_client_id">486108461001-ps621v0k680ofe2oqaf2v6fh9q1ej56r.apps.googleusercontent.com</string>
        </resources>
        EOF

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -d "android" ] && [ -f "android/gradlew" ]; then
          cd android && ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Balaji-AC-App
        path: '**/*.apk'
