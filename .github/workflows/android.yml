name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate debug keystore
      run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Change App Logo (Custom Overwrite)
      run: |
        if [ -f "app/logo.png" ]; then
          echo "Processing custom logo..."
          
          # Force overwrite of all ic_launcher png variations (round/foreground/regular)
          for d in app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp app/logo.png "$d/ic_launcher.png" 2>/dev/null || true
              cp app/logo.png "$d/ic_launcher_round.png" 2>/dev/null || true
              cp app/logo.png "$d/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          
          # Force delete of any adaptive XMLs that would override PNG images on newer Androids
          find app/src/main/res -name "ic_launcher.xml" -delete 2>/dev/null || true
          find app/src/main/res -name "ic_launcher_round.xml" -delete 2>/dev/null || true
          find app/src/main/res -name "ic_launcher_foreground.xml" -delete 2>/dev/null || true
          
          echo "Custom logo override complete!"
        else
          echo "Warning: No logo.png found in app/ folder, using default."
        fi

    - name: Fix permissions
      run: find . -name "gradlew" -exec chmod +x {} + || true

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -d "android" ] && [ -f "android/gradlew" ]; then
          cd android && ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Balaji-AC-App
        path: '**/*.apk'
