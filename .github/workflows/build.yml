name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip Project & Setup
      run: |
        unzip -o BalajAc.zip
        sed -i '/debugConfig/d' app/build.gradle.kts 2>/dev/null || true
        # Missing gradlew file ko automatically banayein
        gradle wrapper

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'
        
