name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Project Setup & Create Wrapper
      run: |
        # Error hatane ke liye debug configuration delete karein
        sed -i '/debugConfig/d' app/build.gradle.kts 2>/dev/null || true
        
        # Agar .env file nahi hai toh example file ka use karein
        if [ ! -f .env ]; then cp .env.example .env; fi
        
        # Missing gradlew file khud banayein
        gradle wrapper
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        
